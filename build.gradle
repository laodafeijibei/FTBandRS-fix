plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    def ftbQuestsVersion = project.findProperty('ftbQuestsVersion') ?: ftb_quests_version

    implementation fg.deobf('local:architectury:9.2.14-forge')
    implementation fg.deobf('local:ftb-library-forge:2001.2.12')
    implementation fg.deobf('local:ftb-teams-forge:2001.3.1')
    implementation fg.deobf('local:item-filters-forge:2001.1.0-build.59')
    implementation fg.deobf("local:ftb-quests-forge:${ftbQuestsVersion}")
    implementation fg.deobf('local:refinedstorage:1.12.4')
    implementation fg.deobf('local:refinedstorageaddons:0.10.0')
    if (project.findProperty('includeInfinityBooster') != 'false') {
        runtimeOnly fg.deobf('local:RSInfinityBooster-1.20.1:1.0+41')
    }
    if (project.findProperty('includeSophisticatedBackpacks') != 'false') {
        runtimeOnly fg.deobf('local:sophisticatedcore:1.3.21.1676')
        runtimeOnly fg.deobf('local:sophisticatedbackpacks:3.24.35.1675')
    }

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            ftb_quests_version_range: ftb_quests_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'             : 'ftbrsbridge.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
